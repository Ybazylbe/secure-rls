[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
# The retrieval tests load a sentence-transformer; deselect with -m "not slow"
# when you want the fast security suite only.
markers = ["slow: needs the embedding model"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
# S101: pytest relies on bare asserts.
# S608: the security tests build hostile SQL from module constants on purpose --
#       constructing those statements *is* the test.
# SIM117: nested `with` blocks keep two tenant sessions visibly open at once,
#       which is the point of the cross-session tests.
# S311: the dataset generator wants a *seeded, reproducible* PRNG. Using a
#       cryptographic source there would break the deterministic fixtures
#       the evaluation suite depends on.
per-file-ignores = { "tests/*" = ["S101", "S608", "SIM117"], "evals/*" = ["S101", "S608"], "scripts/gen_data.py" = ["S311"] }

[tool.mypy]
# No python_version pin: mypy then type-checks against the interpreter actually
# running it. Pinning 3.10 while running 3.12 made it parse numpy's stubs under
# the wrong grammar and fail before reaching any of our code.
strict = true
files = ["secure_rls", "db.py", "scripts", "evals"]

[[tool.mypy.overrides]]
# Third parties without usable stubs. Listed explicitly rather than globally
# silenced, so adding a dependency is a deliberate decision.
module = [
    "faiss.*", "sentence_transformers.*", "streamlit.*", "plotly.*",
    "pandas.*", "sqlglot.*", "langchain_core.*", "langchain_ollama.*",
    "langgraph.*",
]
ignore_missing_imports = true
