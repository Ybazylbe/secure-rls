[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
# S101: pytest relies on bare asserts.
per-file-ignores = { "tests/*" = ["S101"], "evals/*" = ["S101"] }

[tool.mypy]
python_version = "3.10"
strict = true
files = ["secure_rls", "db.py", "scripts"]

[[tool.mypy.overrides]]
module = ["faiss.*", "sentence_transformers.*", "streamlit.*", "plotly.*"]
ignore_missing_imports = true
