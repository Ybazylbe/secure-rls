# Keeps the demo looking the same on any machine, rather than inheriting
# whatever theme the presenter happens to have set. The palette is the teal and
# cyan of the brand the app is presented against.
[theme]
base = "light"
primaryColor = "#00AECD"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F7F9"
textColor = "#123B44"

[browser]
gatherUsageStats = false
